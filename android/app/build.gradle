plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'org.syllaboss.app'
    compileSdk 36
    defaultConfig {
        applicationId 'org.syllaboss.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '2.2.0'
        if (providers.gradleProperty('syllabossVersionCode').isPresent()) versionCode providers.gradleProperty('syllabossVersionCode').get().toInteger()
        if (providers.gradleProperty('syllabossVersionName').isPresent()) versionName providers.gradleProperty('syllabossVersionName').get()
        buildConfigField 'String', 'CLERK_KEY', '"pk_live_Y2xlcmsuc3lsbGFib3NzLm9yZyQ"'
        buildConfigField 'String', 'API_BASE_URL', '"https://syllaboss.org"'
    }
    buildTypes {
        debug {
            def previewApi = providers.gradleProperty('syllabossApiBaseUrl').getOrElse('https://syllaboss.org')
            if (!(previewApi == 'https://syllaboss.org' || previewApi == 'http://10.0.2.2:5173')) throw new GradleException('Use the Syllaboss site or the local emulator preview backend.')
            buildConfigField 'String', 'API_BASE_URL', '"' + previewApi + '"'
        }
        release { minifyEnabled false }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'com.clerk:clerk-android-ui:1.3.0'
    implementation 'com.clerk:clerk-android-api:1.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
}
